<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone Interactive Simulator</title>
  <style>
    :root {
      --wallpaper: linear-gradient(160deg, #0b3b2c 0%, #051c15 55%, #020806 100%);
      --glass: rgba(255, 255, 255, 0.16);
      --glass-strong: rgba(28, 28, 32, 0.86);
      --accent: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0d0f14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    /* إطار الآيفون الواقعي */
    .iphone-chassis {
      width: 100%;
      max-width: 398px;
      height: 836px;
      max-height: 96vh;
      background: linear-gradient(145deg, #2c2f36, #14161a);
      border-radius: 56px;
      padding: 11px;
      box-shadow:
        0 0 0 2px #4a4e58,
        0 0 0 5px #181a1f,
        0 30px 70px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
    }
    .side-btn {
      position: absolute;
      background: #3a3e47;
      border-radius: 3px;
    }
    .btn-mute { left: -4px; top: 115px; width: 3px; height: 26px; }
    .btn-vol-up { left: -4px; top: 160px; width: 3px; height: 48px; }
    .btn-vol-down { left: -4px; top: 220px; width: 3px; height: 48px; }
    .btn-power { right: -4px; top: 185px; width: 3px; height: 74px; cursor: pointer; }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 45px;
      background: var(--wallpaper);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    /* الشريط العلوي والجزيرة التفاعلية */
    .status-bar {
      height: 46px;
      padding: 10px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      z-index: 70;
    }
    .status-zone {
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 8px;
    }
    .status-zone:active { background: rgba(255, 255, 255, 0.15); }
    .dynamic-island {
      width: 114px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      cursor: pointer;
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dynamic-island.expanded {
      width: 245px;
      height: 46px;
    }
    .camera-lens {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2b4c7e, #090d16);
      border: 1px solid #222;
    }

    /* مركز التحكم Control Center */
    .control-center {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 18, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 65;
      padding: 58px 20px 28px;
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .control-center.open { display: flex; }
    .cc-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .cc-card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cc-toggles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .cc-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      border: none;
      color: #fff;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: auto;
    }
    .cc-circle.active { background: var(--accent); }
    .cc-circle.active-green { background: var(--green); }
    .cc-circle.active-orange { background: var(--orange); }
    .cc-slider-box {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cc-slider-box input[type="range"] {
      flex: 1;
      accent-color: #fff;
    }

    /* مركز الإشعارات */
    .notif-drawer {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.82);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      z-index: 64;
      padding: 58px 18px 28px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .notif-drawer.open { display: flex; }

    /* شاشة القفل */
    .lock-screen {
      position: absolute;
      inset: 0;
      padding: 56px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 50;
      background: inherit;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    .lock-screen.unlocked {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .lock-date { font-size: 18px; font-weight: 500; opacity: 0.92; margin-top: 6px; }
    .lock-time { font-size: 82px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; margin-bottom: 24px; }
    .notif-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      margin-bottom: auto;
    }
    .notif-card {
      background: rgba(255, 255, 255, 0.17);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .notif-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .notif-text h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .notif-text p { font-size: 13px; opacity: 0.88; }
    .lock-actions {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 12px;
    }
    .lock-round-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
    .unlock-pill {
      background: rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* الشاشة الرئيسية */
    .home-screen {
      flex: 1;
      padding: 12px 18px 98px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      overflow-y: auto;
    }
    .widget-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .widget-card h3 { font-size: 16px; font-weight: 700; }
    .widget-card p { font-size: 12.5px; opacity: 0.86; margin-top: 2px; }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 10px;
    }
    .app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.14s ease;
    }
    .app-btn:active { transform: scale(0.88); }
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);
    }
    .app-name {
      font-size: 11.5px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
      text-align: center;
    }

    /* الشريط السفلي Dock */
    .dock {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      height: 78px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 20;
    }

    /* شريط الرجوع السفلي */
    .home-bar-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 80;
      cursor: pointer;
    }

      width: 136px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255,
